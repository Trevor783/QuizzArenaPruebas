<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}DRF Tech{% endblock %}</title>
    <style>
        :root {
            --bg: #07111f;
            --bg-soft: #0d1b2a;
            --panel: rgba(15, 23, 42, 0.82);
            --panel-strong: rgba(10, 16, 28, 0.94);
            --line: rgba(148, 163, 184, 0.18);
            --text: #e2e8f0;
            --muted: #94a3b8;
            --primary: #22d3ee;
            --primary-strong: #67e8f9;
            --accent: #8b5cf6;
            --success: #34d399;
            --shadow: 0 20px 45px rgba(15, 23, 42, 0.55);
        }

        * {
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            min-height: 100%;
            font-family: Arial, Helvetica, sans-serif;
            background:
                radial-gradient(circle at top left, rgba(34, 211, 238, 0.12), transparent 35%),
                radial-gradient(circle at top right, rgba(139, 92, 246, 0.14), transparent 30%),
                linear-gradient(135deg, var(--bg) 0%, #020816 100%);
            color: var(--text);
        }

        body::before {
            content: "";
            position: fixed;
            inset: 0;
            background-image:
                linear-gradient(rgba(148, 163, 184, 0.04) 1px, transparent 1px),
                linear-gradient(90deg, rgba(148, 163, 184, 0.04) 1px, transparent 1px);
            background-size: 30px 30px;
            pointer-events: none;
        }

        a {
            color: inherit;
            text-decoration: none;
        }

        .container {
            width: min(1100px, 92%);
            margin: 0 auto;
        }

        .topbar {
            position: sticky;
            top: 0;
            z-index: 20;
            backdrop-filter: blur(12px);
            background: rgba(2, 8, 22, 0.7);
            border-bottom: 1px solid var(--line);
        }

        .nav {
            display: flex;
            align-items: center;
            justify-content: space-between;
            min-height: 74px;
        }

        .brand {
            display: inline-flex;
            align-items: center;
            gap: 12px;
            font-size: 1.1rem;
            font-weight: 700;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }

        .brand-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--primary), var(--accent));
            box-shadow: 0 0 18px rgba(34, 211, 238, 0.8);
        }

        .nav-links {
            display: flex;
            align-items: center;
            gap: 28px;
            color: var(--muted);
            font-size: 0.95rem;
        }

        .nav-links a {
            transition: color 0.2s ease;
        }

        .nav-links a:hover {
            color: var(--primary-strong);
        }

        .nav-button {
            padding: 0.7rem 1.1rem;
            border: 1px solid rgba(34, 211, 238, 0.35);
            border-radius: 999px;
            background: rgba(34, 211, 238, 0.08);
            color: var(--primary-strong);
            font-weight: 600;
            box-shadow: inset 0 0 0 1px rgba(103, 232, 249, 0.15);
        }

        .content {
            position: relative;
            z-index: 1;
            padding: 60px 0 80px;
        }

        .card {
            background: var(--panel);
            border: 1px solid var(--line);
            border-radius: 22px;
            box-shadow: var(--shadow);
        }

        .hero {
            display: grid;
            grid-template-columns: 1.2fr 0.8fr;
            gap: 28px;
            padding: 38px;
            overflow: hidden;
        }

        .eyebrow {
            display: inline-block;
            margin-bottom: 18px;
            padding: 0.45rem 0.8rem;
            border-radius: 999px;
            border: 1px solid rgba(34, 211, 238, 0.25);
            background: rgba(34, 211, 238, 0.08);
            color: var(--primary-strong);
            font-size: 0.72rem;
            font-weight: 700;
            letter-spacing: 0.1em;
            text-transform: uppercase;
        }

        h1, h2, h3, p {
            margin-top: 0;
        }

        h1 {
            font-size: clamp(2.2rem, 5vw, 4rem);
            line-height: 1.05;
            margin-bottom: 18px;
            letter-spacing: -0.05em;
        }

        .lead {
            margin-bottom: 28px;
            color: var(--muted);
            font-size: 1.06rem;
            line-height: 1.7;
            max-width: 620px;
        }

        .actions {
            display: flex;
            flex-wrap: wrap;
            gap: 16px;
            margin-bottom: 28px;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 0.9rem 1.4rem;
            border-radius: 12px;
            font-weight: 700;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .btn:hover {
            transform: translateY(-1px);
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--primary), var(--accent));
            color: #03111c;
            box-shadow: 0 14px 26px rgba(103, 232, 249, 0.25);
        }

        .btn-secondary {
            border: 1px solid var(--line);
            background: rgba(148, 163, 184, 0.05);
            color: var(--text);
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 16px;
        }

        .stat {
            padding: 18px 16px;
            border-radius: 16px;
            border: 1px solid var(--line);
            background: rgba(15, 23, 42, 0.65);
        }

        .stat strong {
            display: block;
            font-size: 1.7rem;
            margin-bottom: 6px;
        }

        .stat span {
            color: var(--muted);
            font-size: 0.84rem;
        }

        .panel {
            padding: 30px 26px;
            background: linear-gradient(180deg, rgba(15, 23, 42, 0.9), rgba(10, 16, 28, 0.95));
            border: 1px solid var(--line);
            border-radius: 20px;
            position: relative;
        }

        .panel::before {
            content: "";
            position: absolute;
            inset: 18px 18px auto auto;
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(34, 211, 238, 0.2), transparent 60%);
            filter: blur(12px);
        }

        .terminal {
            padding: 18px;
            border-radius: 14px;
            background: rgba(2, 6, 23, 0.82);
            border: 1px solid rgba(148, 163, 184, 0.18);
            box-shadow: inset 0 1px 0 rgba(255,255,255,0.03);
            font-family: "Consolas", "Courier New", monospace;
            color: var(--primary-strong);
            line-height: 1.7;
        }

        .terminal .prompt {
            color: var(--success);
        }

        .terminal .value {
            color: #c4b5fd;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 22px;
            margin-top: 30px;
        }

        .feature {
            padding: 24px 20px;
        }

        .feature-icon {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 48px;
            height: 48px;
            border-radius: 14px;
            background: rgba(34, 211, 238, 0.1);
            color: var(--primary-strong);
            font-size: 1.3rem;
            margin-bottom: 18px;
        }

        .feature p {
            color: var(--muted);
            line-height: 1.7;
            margin-bottom: 0;
        }

        @media (max-width: 820px) {
            .hero,
            .grid {
                grid-template-columns: 1fr;
            }

            .nav {
                flex-wrap: wrap;
                justify-content: center;
                padding: 16px 0;
            }

            .nav-links {
                width: 100%;
                justify-content: center;
                flex-wrap: wrap;
                gap: 12px 20px;
            }

            .stats {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <header class="topbar">
        <div class="container nav">
            <div class="brand">
                <span class="brand-dot"></span>
                <span>DRF</span>
            </div>
            <nav class="nav-links" aria-label="Main navigation">
                <a href="#">Inicio</a>
                <a href="#">Servicios</a>
                <a href="#">Tecnología</a>
                <a href="#">Contacto</a>
            </nav>
            <a href="#" class="nav-button">Probar demo</a>
        </div>
    </header>

    <main class="container content">
        {% block content %}{% endblock %}
    </main>
</body>
</html>
